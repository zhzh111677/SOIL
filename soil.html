<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style> .chart-box { width:400px; height:300px; margin:0 auto } </style>
</head>
<body>
  <div class="chart-box">
    <canvas id="soilRadar"></canvas>
  </div>
  <script>
    const ctx = document.getElementById('soilRadar');
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['容重(g/cm³)', '含水率(%)', '砂砾(%)', '粉粒(%)', '粘粒(%)'],
        datasets: [
          {
            label: '岐山县',
            data: [1.43, 18.87, 10.38, 82.90, 7.30],
            borderColor: '#8B4513',
            backgroundColor: 'rgba(139, 69, 19, 0.2)'
          },
          {
            label: '乾县',
            data: [1.38, 22.34, 5.38, 85.87, 8.74],
            borderColor: '#1E90FF',
            backgroundColor: 'rgba(30, 144, 255, 0.2)'
          },
          {
            label: '礼泉县',
            data: [1.42, 25.56, 6.36, 83.93, 9.71],
            borderColor: '#2E8B57',
            backgroundColor: 'rgba(46, 139, 87, 0.2)'
          }
        ]
      },
      options: {
        scales: { r: { angleLines: { display: true }, suggestedMin: 0 } }
      }
    });
  </script>
</body>
</html>
